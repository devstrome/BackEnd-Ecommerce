name: belorella

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - /etc/belorella/backend.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "2"
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in deploy/docker/.env}
      SITE_URL: ${SITE_URL:-${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}}
      ADMIN_URL: ${SITE_URL:-${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}}
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../../frontend}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URI: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}
        NEXT_PUBLIC_SOCKET_URI: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/docker/.env}}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_YOUTUBE_URL: ${NEXT_PUBLIC_YOUTUBE_URL:-}
        NEXT_PUBLIC_UBER_CLIENT_ID: ${NEXT_PUBLIC_UBER_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
